<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>DevCast - Vibrant SaaS</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50 text-slate-900 min-h-screen">
<div class="flex min-h-screen">
  <aside class="w-64 flex flex-col p-4">
    <div class="bg-white/80 backdrop-blur rounded-2xl shadow-sm shadow-indigo-100 flex-1 flex flex-col p-4">
      <div class="flex items-center gap-2 px-2 py-3 mb-4">
        <div class="w-8 h-8 rounded-xl bg-gradient-to-br from-indigo-500 to-purple-500 flex items-center justify-center text-white font-bold">D</div>
        <span class="text-lg font-extrabold bg-gradient-to-r from-indigo-600 to-purple-600 bg-clip-text text-transparent">DevCast</span>
      </div>
      <nav class="flex-1 space-y-1 text-sm">
        <a class="flex items-center gap-2 px-3 py-2.5 rounded-xl bg-gradient-to-r from-indigo-500 to-purple-500 text-white font-medium shadow-md shadow-indigo-200" href="#">📝 記事一覧</a>
        <a class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-slate-500 hover:bg-indigo-50" href="#">🚀 配信先設定</a>
        <a class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-slate-500 hover:bg-indigo-50" href="#">🏷️ タグ管理</a>
        <a class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-slate-500 hover:bg-indigo-50" href="#">📊 分析</a>
        <a class="flex items-center gap-2 px-3 py-2.5 rounded-xl text-slate-500 hover:bg-indigo-50" href="#">⚙️ 設定</a>
      </nav>
      <div class="rounded-xl bg-gradient-to-br from-indigo-500 to-purple-600 p-4 text-white text-xs">
        <p class="font-semibold mb-1">✨ Proにアップグレード</p>
        <p class="text-indigo-100">無制限の配信先連携</p>
      </div>
    </div>
  </aside>

  <main class="flex-1 p-4 pl-0">
    <div class="bg-white/60 backdrop-blur rounded-2xl shadow-sm shadow-indigo-100 min-h-full p-8">
      <div class="flex items-center justify-between mb-8">
        <div>
          <h1 class="text-2xl font-extrabold text-slate-900">おかえりなさい 👋</h1>
          <p class="text-slate-500 text-sm mt-1">今日も記事を配信しましょう</p>
        </div>
        <button class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white text-sm px-5 py-2.5 rounded-xl font-medium shadow-lg shadow-indigo-200 hover:shadow-xl transition">＋ 新規記事を書く</button>
      </div>

      <div class="grid grid-cols-4 gap-4 mb-8">
        <div class="rounded-2xl p-5 bg-gradient-to-br from-emerald-400 to-teal-500 text-white shadow-lg shadow-emerald-100">
          <p class="text-xs opacity-90">公開中</p>
          <p class="text-3xl font-extrabold mt-1">42</p>
        </div>
        <div class="rounded-2xl p-5 bg-gradient-to-br from-amber-400 to-orange-500 text-white shadow-lg shadow-orange-100">
          <p class="text-xs opacity-90">下書き</p>
          <p class="text-3xl font-extrabold mt-1">7</p>
        </div>
        <div class="rounded-2xl p-5 bg-gradient-to-br from-sky-400 to-blue-500 text-white shadow-lg shadow-blue-100">
          <p class="text-xs opacity-90">配信先</p>
          <p class="text-3xl font-extrabold mt-1">3</p>
        </div>
        <div class="rounded-2xl p-5 bg-gradient-to-br from-fuchsia-400 to-pink-500 text-white shadow-lg shadow-pink-100">
          <p class="text-xs opacity-90">今月の配信</p>
          <p class="text-3xl font-extrabold mt-1">18</p>
        </div>
      </div>

      <div class="bg-white rounded-2xl shadow-sm overflow-hidden">
        <div class="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 class="font-semibold text-slate-800">最近の記事</h2>
          <a class="text-sm text-indigo-600 font-medium" href="#">すべて見る →</a>
        </div>
        <div class="divide-y divide-slate-100">
          <div class="flex items-center justify-between px-6 py-4 hover:bg-indigo-50/50 transition">
            <div>
              <p class="font-semibold text-slate-800">React 19のCompilerを試してみた</p>
              <div class="flex gap-1.5 mt-1.5">
                <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium">Qiita</span>
                <span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full text-xs font-medium">DEV</span>
              </div>
            </div>
            <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-semibold">公開済み</span>
          </div>
          <div class="flex items-center justify-between px-6 py-4 hover:bg-indigo-50/50 transition">
            <div>
              <p class="font-semibold text-slate-800">PHP-DIとSlim Frameworkの設計指針</p>
              <div class="flex gap-1.5 mt-1.5">
                <span class="px-2 py-0.5 bg-pink-100 text-pink-700 rounded-full text-xs font-medium">はてな</span>
              </div>
            </div>
            <span class="px-3 py-1 bg-amber-100 text-amber-700 rounded-full text-xs font-semibold">下書き</span>
          </div>
          <div class="flex items-center justify-between px-6 py-4 hover:bg-indigo-50/50 transition">
            <div>
              <p class="font-semibold text-slate-800">Multi-Publisher CMSを設計する</p>
              <div class="flex gap-1.5 mt-1.5">
                <span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium">Qiita</span>
                <span class="px-2 py-0.5 bg-blue-100 text-blue-700 rounded-full text-xs font-medium">DEV</span>
                <span class="px-2 py-0.5 bg-pink-100 text-pink-700 rounded-full text-xs font-medium">はてな</span>
              </div>
            </div>
            <span class="px-3 py-1 bg-emerald-100 text-emerald-700 rounded-full text-xs font-semibold">公開済み</span>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>
</body>
</html>
