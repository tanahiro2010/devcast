<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>DevCast - Minimal</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Inter',sans-serif}</style>
</head>
<body class="bg-neutral-50 text-neutral-900">
<div class="flex min-h-screen">
  <!-- Sidebar -->
  <aside class="w-60 border-r border-neutral-200 bg-white flex flex-col">
    <div class="h-16 flex items-center px-6 border-b border-neutral-200">
      <span class="text-lg font-semibold tracking-tight">DevCast</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
      <a class="flex items-center gap-2 px-3 py-2 rounded-md bg-neutral-100 font-medium" href="#">
        <span class="w-1.5 h-1.5 rounded-full bg-neutral-900"></span> 記事一覧
      </a>
      <a class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-500 hover:bg-neutral-100" href="#">配信先設定</a>
      <a class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-500 hover:bg-neutral-100" href="#">タグ管理</a>
      <a class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-500 hover:bg-neutral-100" href="#">分析</a>
      <a class="flex items-center gap-2 px-3 py-2 rounded-md text-neutral-500 hover:bg-neutral-100" href="#">設定</a>
    </nav>
    <div class="p-4 border-t border-neutral-200 flex items-center gap-3">
      <div class="w-8 h-8 rounded-full bg-neutral-900 text-white text-xs flex items-center justify-center font-medium">U8</div>
      <div class="text-sm">
        <p class="font-medium leading-none">under18.dev</p>
        <p class="text-neutral-400 text-xs mt-1">Free Plan</p>
      </div>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1">
    <header class="h-16 border-b border-neutral-200 flex items-center justify-between px-8 bg-white">
      <h1 class="text-xl font-semibold">記事一覧</h1>
      <button class="bg-neutral-900 text-white text-sm px-4 py-2 rounded-md hover:bg-neutral-800 transition">＋ 新規記事</button>
    </header>

    <div class="p-8 space-y-6">
      <!-- Stats -->
      <div class="grid grid-cols-4 gap-4">
        <div class="bg-white border border-neutral-200 rounded-lg p-5">
          <p class="text-sm text-neutral-500">公開中の記事</p>
          <p class="text-2xl font-semibold mt-1">42</p>
        </div>
        <div class="bg-white border border-neutral-200 rounded-lg p-5">
          <p class="text-sm text-neutral-500">下書き</p>
          <p class="text-2xl font-semibold mt-1">7</p>
        </div>
        <div class="bg-white border border-neutral-200 rounded-lg p-5">
          <p class="text-sm text-neutral-500">配信先</p>
          <p class="text-2xl font-semibold mt-1">3</p>
        </div>
        <div class="bg-white border border-neutral-200 rounded-lg p-5">
          <p class="text-sm text-neutral-500">今月の配信数</p>
          <p class="text-2xl font-semibold mt-1">18</p>
        </div>
      </div>

      <!-- Table -->
      <div class="bg-white border border-neutral-200 rounded-lg overflow-hidden">
        <table class="w-full text-sm">
          <thead class="bg-neutral-50 text-neutral-500 text-xs uppercase tracking-wide">
            <tr>
              <th class="text-left px-5 py-3 font-medium">タイトル</th>
              <th class="text-left px-5 py-3 font-medium">配信先</th>
              <th class="text-left px-5 py-3 font-medium">ステータス</th>
              <th class="text-left px-5 py-3 font-medium">更新日</th>
            </tr>
          </thead>
          <tbody class="divide-y divide-neutral-100">
            <tr class="hover:bg-neutral-50">
              <td class="px-5 py-4 font-medium">React 19のCompilerを試してみた</td>
              <td class="px-5 py-4"><span class="inline-flex gap-1"><span class="px-2 py-0.5 bg-green-50 text-green-700 rounded text-xs">Qiita</span><span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs">DEV</span></span></td>
              <td class="px-5 py-4"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium">公開済み</span></td>
              <td class="px-5 py-4 text-neutral-400">2026-08-20</td>
            </tr>
            <tr class="hover:bg-neutral-50">
              <td class="px-5 py-4 font-medium">PHP-DIとSlim Frameworkの設計指針</td>
              <td class="px-5 py-4"><span class="px-2 py-0.5 bg-pink-50 text-pink-700 rounded text-xs">はてな</span></td>
              <td class="px-5 py-4"><span class="px-2 py-0.5 bg-amber-100 text-amber-700 rounded-full text-xs font-medium">下書き</span></td>
              <td class="px-5 py-4 text-neutral-400">2026-08-19</td>
            </tr>
            <tr class="hover:bg-neutral-50">
              <td class="px-5 py-4 font-medium">Multi-Publisher CMSを設計する</td>
              <td class="px-5 py-4"><span class="inline-flex gap-1"><span class="px-2 py-0.5 bg-green-50 text-green-700 rounded text-xs">Qiita</span><span class="px-2 py-0.5 bg-blue-50 text-blue-700 rounded text-xs">DEV</span><span class="px-2 py-0.5 bg-pink-50 text-pink-700 rounded text-xs">はてな</span></span></td>
              <td class="px-5 py-4"><span class="px-2 py-0.5 bg-emerald-100 text-emerald-700 rounded-full text-xs font-medium">公開済み</span></td>
              <td class="px-5 py-4 text-neutral-400">2026-08-15</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
</div>
</body>
</html>
