name: Auto Deploy
on:
  workflow_dispatch:
    inputs:
      target:
        description: 'デプロイ対象'
        type: choice
        required: true
        default: all
        options:
          - all
          - lp
          - frontend
          - backend
          - docs
  push:
    branches: main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lp: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'lp')) || (github.event_name == 'push' && steps.filter.outputs.lp == 'true') }}
      frontend: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'frontend')) || (github.event_name == 'push' && steps.filter.outputs.frontend == 'true') }}
      backend: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'backend')) || (github.event_name == 'push' && steps.filter.outputs.backend == 'true') }}
      docs: ${{ (github.event_name == 'workflow_dispatch' && (inputs.target == 'all' || inputs.target == 'docs')) || (github.event_name == 'push' && steps.filter.outputs.docs == 'true') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lp:
              - 'lp/**'
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'
            docs:
              - 'backend/docs/**'

  LandingPage:
    needs: changes
    if: needs.changes.outputs.lp == 'true'
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3
    
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: ./lp
        run: bun ci

      - name: Build Project
        working-directory: ./lp
        run: bun run build

      - name: FTP Deploy
        uses: Wandalen/wretry.action@v3
        with:
          action: SamKirkland/FTP-Deploy-Action@4.0.0
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            local-dir: ./lp/dist/
            server-dir: /devcast.work/public_html/

  ServicePage:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: ./frontend
        run: bun ci

      - name: Write Envs to .env
        run: |
          echo "VITE_API_URL=${{ secrets.API_URL }}" >> ./frontend/.env
          echo "VITE_FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> ./frontend/.env
        
      - name: Build Project
        working-directory: ./frontend
        run: bun run build

      - name: FTP Deploy
        uses: Wandalen/wretry.action@v3
        with:
          action: SamKirkland/FTP-Deploy-Action@4.0.0
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            local-dir: ./frontend/dist/
            server-dir: /devcast.work/public_html/app.devcast.work/

  ServiceAPI:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps: # SSH + rsync Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host key
        run: ssh-keyscan -p 10022 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Write Envs to .htaccess
        run: |
          echo "SetEnv DB_HOST ${{ secrets.DB_HOST }}" >> ./backend/.htaccess
          echo "SetEnv DB_NAME ${{ secrets.DB_NAME }}" >> ./backend/.htaccess
          echo "SetEnv DB_USER ${{ secrets.DB_USER }}" >> ./backend/.htaccess
          echo "SetEnv DB_PASSWORD ${{ secrets.DB_PASSWORD }}" >> ./backend/.htaccess
          echo "SetEnv JWT_SECRET  ${{ secrets.JWT_SECRET }}" >> ./backend/.htaccess
          echo "SetEnv CRYPTO_KEY ${{ secrets.CRYPTO_KEY }}" >> ./backend/.htaccess
          echo "SetEnv FRONTEND_URL ${{ secrets.FRONTEND_URL }}" >> ./backend/.htaccess
          echo "SetEnv BACKEND_URL ${{ secrets.BACKEND_URL }}" >> ./backend/.htaccess
          echo "SetEnv GITHUB_CLIENT_ID ${{ secrets.CLIENT_ID_GITHUB }}" >> ./backend/.htaccess
          echo "SetEnv GITHUB_CLIENT_SECRET ${{ secrets.CLIENT_SECRET_GITHUB }}" >> ./backend/.htaccess
          echo "SetEnv GITHUB_REDIRECT_URI ${{ secrets.REDIRECT_URI_GITHUB }}" >> ./backend/.htaccess
          echo "SetEnv STRIPE_PUBLIC_KEY ${{ secrets.STRIPE_PUBLIC_KEY }}" >> ./backend/.htaccess
          echo "SetEnv STRIPE_SECRET_KEY ${{ secrets.STRIPE_SECRET_KEY }}" >> ./backend/.htaccess

      - name: Rsync Deploy
        run: |
          rsync -az --delete \
            -e "ssh -p 10022" \
            ./backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/devcast.work/public_html/api.devcast.work/

      - name: Run Database Migrations
        run: |
          ssh -p 10022 ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "cd /home/${{ secrets.SSH_USER }}/devcast.work/public_html/api.devcast.work && \
             DB_HOST='${{ secrets.DB_HOST }}' \
             DB_NAME='${{ secrets.DB_NAME }}' \
             DB_USER='${{ secrets.DB_USER }}' \
             DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
             /usr/bin/php8.5 scripts/migrate.php"

  ApiDocs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: ./backend/docs
        run: bun install

      - name: Build OpenAPI spec + HTML docs
        working-directory: ./backend/docs
        run: bun run build:all

      - name: FTP Deploy
        uses: Wandalen/wretry.action@v3
        with:
          action: SamKirkland/FTP-Deploy-Action@4.0.0
          attempt_limit: 3
          attempt_delay: 5000
          with: |
            server: ${{ secrets.FTP_SERVER }}
            username: ${{ secrets.FTP_USERNAME }}
            password: ${{ secrets.FTP_PASSWORD }}
            local-dir: ./backend/docs/dist/
            server-dir: /devcast.work/public_html/docs.devcast.work/api/