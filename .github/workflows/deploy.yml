name: Auto Deploy
on: 
  workflow_dispatch:
  push:
    branches: main

jobs:
  LandingPage:
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3
    
      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'
      
      - name: Install Dependencies
        working-directory: ./lp
        run: npm install

      - name: Build Project
        working-directory: ./lp
        run: npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./lp/dist/
          server-dir: /devcast.work/public_html/

  ServicePage:
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '22'

      - name: Install Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Project
        working-directory: ./frontend
        run: npm run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /devcast.work/public_html/app.devcast.work/

  ServiceAPI:
    runs-on: ubuntu-latest
    steps: # SSH + rsync Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host key
        run: ssh-keyscan -p 10022 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Write Envs to .htaccess
        run: |
          echo "SetEnv DB_HOST ${{ secrets.DB_HOST }}" >> ./backend/.htaccess
          echo "SetEnv DB_NAME ${{ secrets.DB_NAME }}" >> ./backend/.htaccess
          echo "SetEnv DB_USER ${{ secrets.DB_USER }}" >> ./backend/.htaccess
          echo "SetEnv DB_PASSWORD ${{ secrets.DB_PASSWORD }}" >> ./backend/.htaccess

      - name: Rsync Deploy
        run: |
          rsync -az --delete \
            -e "ssh -p 10022" \
            ./backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/devcast.work/public_html/api.devcast.work/