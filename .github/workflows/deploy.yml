name: Auto Deploy
on: 
  workflow_dispatch:
  push:
    branches: main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      lp: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.lp == 'true' }}
      frontend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.frontend == 'true' }}
      backend: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.backend == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lp:
              - 'lp/**'
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

  LandingPage:
    needs: changes
    if: needs.changes.outputs.lp == 'true'
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3
    
      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: ./lp
        run: bun install

      - name: Build Project
        working-directory: ./lp
        run: bun run build

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./lp/dist/
          server-dir: /devcast.work/public_html/

  ServicePage:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    steps: # FTP Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install Dependencies
        working-directory: ./frontend
        run: bun install

      - name: Build Project
        working-directory: ./frontend
        run: bun run build

      - name: Write Envs to .env
        run: |
          echo "VITE_API_URL=${{ secrets.API_URL }}" >> ./frontend/.env
          echo "VITE_FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> ./frontend/.env

      - name: FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@4.0.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/dist/
          server-dir: /devcast.work/public_html/app.devcast.work/

  ServiceAPI:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps: # SSH + rsync Deploy
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add remote host key
        run: ssh-keyscan -p 10022 ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Write Envs to .htaccess
        run: |
          echo "SetEnv DB_HOST ${{ secrets.DB_HOST }}" >> ./backend/.htaccess
          echo "SetEnv DB_NAME ${{ secrets.DB_NAME }}" >> ./backend/.htaccess
          echo "SetEnv DB_USER ${{ secrets.DB_USER }}" >> ./backend/.htaccess
          echo "SetEnv DB_PASSWORD ${{ secrets.DB_PASSWORD }}" >> ./backend/.htaccess
          echo "SetEnv JWT_SECRET  ${{ secrets.JWT_SECRET }}" >> ./backend/.htaccess
          echo "SetEnv CRYPTO_KEY ${{ secrets.CRYPTO_KEY }}" >> ./backend/.htaccess
          echo "SetEnv FRONTEND_URL ${{ secrets.FRONTEND_URL }}" >> ./backend/.htaccess
          echo "SetEnv GITHUB_CLIENT_ID ${{ secrets.CLIENT_ID_GITHUB }}" >> ./backend/.htaccess
          echo "SetEnv GITHUB_CLIENT_SECRET ${{ secrets.CLIENT_SECRET_GITHUB }}" >> ./backend/.htaccess
          echo "SetEnv GITHUB_REDIRECT_URI ${{ secrets.REDIRECT_URI_GITHUB }}" >> ./backend/.htaccess

      - name: Rsync Deploy
        run: |
          rsync -az --delete \
            -e "ssh -p 10022" \
            ./backend/ \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:/home/${{ secrets.SSH_USER }}/devcast.work/public_html/api.devcast.work/