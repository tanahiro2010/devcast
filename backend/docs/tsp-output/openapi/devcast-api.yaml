openapi: 3.0.0
info:
  title: DevCast API
  version: 1.0.0
  description: |-
    DevCast backend API (Slim Framework 4 / PHP).

    Generated by hand-reading the live controllers under `backend/src/Futures`
    and `backend/src/Config/routes.php`, since the backend has no schema
    library (no zod / class-validator equivalent) to generate from
    automatically. Treat this spec as the source of truth for the HTTP
    contract; when the backend changes, update the corresponding `.tsp`
    file in this directory and recompile with `bun run build`.
tags:
  - name: Health
  - name: Auth
  - name: V1
  - name: Errors
paths:
  /auth:
    get:
      operationId: Auth_oauthUrl
      description: |-
        Generates the GitHub OAuth authorization URL.
        backend/src/Futures/Auth/AuthController.php:13
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    $ref: '#/components/schemas/Auth.OAuthUrlData'
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
        '500':
          description: 500 Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - Auth
      security:
        - {}
  /auth/callback:
    get:
      operationId: Auth_callback
      description: |-
        GitHub OAuth callback. On success this issues a 302 redirect to
        `{frontend_base_url}/_auth/callback?token={jwt}` rather than a JSON
        body.
        backend/src/Futures/Auth/Callback/CallbackController.php:25
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
          explode: false
        - name: state
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '302':
          description: Redirection
          headers:
            location:
              required: true
              schema:
                type: string
        '400':
          description: 400 Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
        '500':
          description: 500 Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - Auth
      security:
        - {}
  /auth/profile:
    get:
      operationId: Auth_getProfile
      description: |-
        Requires a bearer JWT. Returns the authenticated user's profile.
        backend/src/Futures/Auth/Profile/ProfileController.php:14
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    $ref: '#/components/schemas/Auth.ProfileData'
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
        '401':
          description: 401 Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
        '500':
          description: 500 Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - Auth
      security:
        - BearerAuth: []
  /auth/token/access_token:
    get:
      operationId: Auth_accessToken
      description: |-
        Exchanges a refresh token (as a query parameter) for a new access
        token. Distinct from `refreshToken`, which requires a bearer JWT and
        also rotates the refresh token.
        backend/src/Futures/Auth/AccessToken/AccessTokenController.php:16
      parameters:
        - name: refresh_token
          in: query
          required: true
          schema:
            type: string
          explode: false
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    $ref: '#/components/schemas/Auth.AccessTokenData'
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
        '400':
          description: 400 Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
        '401':
          description: 401 Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - Auth
      security:
        - {}
  /auth/token/refresh_token:
    get:
      operationId: Auth_refreshToken
      description: |-
        Requires a bearer JWT. Invalidates all of the user's existing
        sessions and issues a brand new access + refresh token pair.
        backend/src/Futures/Auth/RefreshToken/RefreshTokenController.php:14
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    $ref: '#/components/schemas/Auth.RefreshTokenData'
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
        '401':
          description: 401 Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
        '500':
          description: 500 Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - Auth
      security:
        - BearerAuth: []
  /health:
    get:
      operationId: Health_health
      description: |-
        Liveness check. Returns a plain-text body, not JSON.
        backend/src/Futures/Health/HealthController.php:8
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            text/plain:
              schema:
                type: string
      tags:
        - Health
      security:
        - {}
  /v1:
    get:
      operationId: V1_version
      description: backend/src/Futures/Version1/Version1Controller.php:10
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    $ref: '#/components/schemas/V1.VersionData'
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
      tags:
        - V1
      security:
        - BearerAuth: []
  /v1/providers:
    get:
      operationId: V1_getProviders
      description: backend/src/Futures/Version1/Providers/ProvidersController.php:13
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    $ref: '#/components/schemas/V1.ProvidersData'
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
      tags:
        - V1
      security:
        - BearerAuth: []
    post:
      operationId: V1_registerProvider
      description: |-
        Registers a linked OAuth provider credential for the authenticated
        user.

        NOTE: as of 2026-08-26 this action is implemented in
        `ProvidersController::registerProvider` but is NOT registered in
        `backend/src/Config/routes.php` — calling `POST /v1/providers`
        currently falls through to the catch-all 404 handler. Documented
        here ahead of wiring so the contract is agreed before it ships.
      parameters: []
      responses:
        '200':
          description: The request has succeeded.
          content:
            application/json:
              schema:
                type: object
                required:
                  - data
                  - message
                properties:
                  data:
                    nullable: true
                  message:
                    type: string
                description: |-
                  Common success envelope, mirrors `App\Models\Response\Success`
                  (backend/src/Models/Response/Success.php).
        '400':
          description: 400 Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
        '500':
          description: 500 Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - V1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/V1.RegisterProviderBody'
      security:
        - BearerAuth: []
  /{path}:
    get:
      operationId: Errors_notFound
      parameters:
        - name: path
          in: path
          required: true
          schema:
            type: string
      responses:
        '404':
          description: 404 Not Found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Common.ApiError'
      tags:
        - Errors
components:
  schemas:
    Auth.AccessTokenData:
      type: object
      required:
        - access_token
      properties:
        access_token:
          type: string
    Auth.OAuthUrlData:
      type: object
      required:
        - url
      properties:
        url:
          type: string
          description: GitHub OAuth authorization URL to redirect the user to.
    Auth.ProfileData:
      type: object
      required:
        - profile
      properties:
        profile:
          $ref: '#/components/schemas/Models.Profile'
    Auth.RefreshTokenData:
      type: object
      required:
        - access_token
        - refresh_token
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
    Common.ApiError:
      type: object
      required:
        - details
        - message
        - code
      properties:
        details:
          $ref: '#/components/schemas/Common.ErrorDetails'
        message:
          type: string
          nullable: true
        code:
          $ref: '#/components/schemas/Common.ErrorCode'
      description: |-
        Common error envelope, mirrors `App\Models\Response\Error`
        (backend/src/Models/Response/Error.php).
    Common.ApiForbiddenResponse:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/Common.ApiError'
      description: 403 Forbidden
    Common.ApiUnprocessableEntityResponse:
      type: object
      required:
        - body
      properties:
        body:
          $ref: '#/components/schemas/Common.ApiError'
      description: 422 Unprocessable Entity
    Common.ErrorCode:
      type: string
      enum:
        - INVALID_CODE
        - INVALID_STATE
        - INVALID_REDIRECT_URI
        - INVALID_CLIENT_ID
        - INVALID_CLIENT_SECRET
        - INVALID_ACCESS_TOKEN
        - EXPIRED_ACCESS_TOKEN
        - REVOKED_ACCESS_TOKEN
        - INSUFFICIENT_SCOPE
        - MISSING_CODE_OR_STATE
        - TOKEN_EXCHANGE_FAILED
        - INVALID_CREDENTIALS
        - ACCOUNT_LOCKED
        - ACCOUNT_DISABLED
        - UNAUTHORIZED
        - SESSION_NOT_FOUND
        - PERMISSION_DENIED
        - UNAUTHORIZED_ACCESS
        - INVALID_INPUT
        - RESOURCE_NOT_FOUND
        - SERVER_ERROR
        - SOMETHING_WENT_WRONG
        - INVALID_REQUEST_BODY
        - INVALID_QUERY_PARAMS
        - VALIDATION_FAILED
        - MISSING_REQUIRED_FIELDS
        - INVALID_FIELD_FORMAT
        - FIELD_TOO_LONG
        - FIELD_TOO_SHORT
        - FIELD_NOT_UNIQUE
        - DATABASE_ERROR
        - RECORD_NOT_FOUND
        - DUPLICATE_RECORD
        - FOREIGN_KEY_VIOLATION
        - RATE_LIMIT_EXCEEDED
        - API_VERSION_NOT_SUPPORTED
        - ENDPOINT_NOT_FOUND
        - METHOD_NOT_ALLOWED
        - AUTHENTICATION_FAILED
        - TOKEN_EXPIRED
        - TOKEN_INVALID
        - TOKEN_MISSING
        - TOKEN_REVOKED
      description: |-
        Application-level error code, mirrors `App\Models\Response\Code`
        (backend/src/Models/Response/Code.php).
    Common.ErrorDetails:
      type: object
      required:
        - instance
        - date
        - status
      properties:
        instance:
          type: string
          description: The request path that produced the error, e.g. `/auth/profile`.
        date:
          type: string
          description: Server-local timestamp, `Y-m-d H:i:s` format.
        status:
          type: integer
          format: int32
          description: HTTP status code, duplicated from the response status line.
      description: |-
        Mirrors `App\Models\Response\Base\Details`
        (backend/src/Models/Response/Base/Details.php).
    Models.Profile:
      type: object
      required:
        - id
        - username
        - email
        - providers
        - created_at
        - updated_at
        - subscription
      properties:
        id:
          type: integer
          format: int32
        username:
          type: string
        email:
          type: string
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Models.Provider'
        created_at:
          type: string
        updated_at:
          type: string
        subscription:
          type: object
          allOf:
            - $ref: '#/components/schemas/Models.Subscription'
          nullable: true
      description: |-
        Mirrors the array built in
        `App\Futures\Auth\Profile\ProfileService::getProfile`
        (backend/src/Futures/Auth/Profile/ProfileService.php:7-29).
    Models.Provider:
      type: object
      required:
        - id
        - provider
        - expires_at
      properties:
        id:
          type: integer
          format: int32
        provider:
          type: string
        expires_at:
          type: string
      description: |-
        A linked OAuth provider credential, as returned by `User::providers()`
        (backend/src/Models/DB/User.php) and used by both
        `GET /auth/profile` and `GET /v1/providers`.
    Models.Subscription:
      type: object
      required:
        - stripe_subscription_id
        - stripe_price_id
        - status
        - current_period_start
        - current_period_end
      properties:
        stripe_subscription_id:
          type: string
        stripe_price_id:
          type: string
        status:
          type: string
        current_period_start:
          type: string
        current_period_end:
          type: string
      description: |-
        Mirrors the `subscription` block built in
        `App\Futures\Auth\Profile\ProfileService::getProfile`
        (backend/src/Futures/Auth/Profile/ProfileService.php:18-24),
        sourced from `App\Models\DB\Subscriptions`.
    V1.ProvidersData:
      type: object
      required:
        - providers
      properties:
        providers:
          type: array
          items:
            $ref: '#/components/schemas/Models.Provider'
    V1.RegisterProviderBody:
      type: object
      required:
        - provider
        - token
        - expires_at
      properties:
        provider:
          type: string
        token:
          type: string
        expires_at:
          type: string
          description: ISO-8601 date-time string, parsed with PHP's `new \DateTime(...)`.
      description: |-
        Body for registering a linked OAuth provider credential.
        backend/src/Futures/Version1/Providers/ProvidersController.php:23-44
    V1.VersionData:
      type: object
      required:
        - version
      properties:
        version:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: Bearer
servers:
  - url: http://localhost:8080
    description: Local development
    variables: {}
